###############################################################################
# Terraform plan on pull requests
#
# Real-world notes:
# - Plan without credentials is still valuable: fmt + validate catch most
#   syntax and provider mistakes before review.
# - For real plans against an account, store OIDC or short-lived keys in
#   GitHub Environments and scope them to this workflow only.
# - Never run apply from PR. Apply from main (or a promotion workflow) only.
# - Matrix over aws/examples/complete and gcp/examples/complete so both
#   stacks are checked on every PR that touches modules.
###############################################################################

name: Terraform Plan

on:
  pull_request:
    paths:
      - "aws/**"
      - "gcp/**"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches: [main]
    paths:
      - "aws/**"
      - "gcp/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - path: aws/examples/complete
            name: aws-complete
          - path: gcp/examples/complete
            name: gcp-complete
    defaults:
      run:
        working-directory: ${{ matrix.stack.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
        working-directory: .
        continue-on-error: false

      - name: Terraform init (backend=false)
        id: init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const name = '${{ matrix.stack.name }}';
            const fmt = '${{ steps.fmt.outcome }}';
            const init = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const body = [
              `### Terraform check: \`${name}\``,
              `| Step | Result |`,
              `| --- | --- |`,
              `| fmt | ${fmt} |`,
              `| init | ${init} |`,
              `| validate | ${validate} |`,
              ``,
              `_Plan against a real account is optional: add cloud credentials via OIDC and a follow-on job._`
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
